services:
  qijuan:
    build: .
    image: qijuan:local
    ports:
      - "8080:8080"
    environment:
      QIJUAN_DATA_DIR: /data
      QIJUAN_PORT: "8080"
      QIJUAN_LIBRARY_PATHS: /data/library
    volumes:
      - qijuan-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  qijuan-data:
